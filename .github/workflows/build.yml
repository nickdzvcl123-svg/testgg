name: Build MobileHouseArrest

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and package iOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No source ZIP found."
            exit 1
          fi
          echo "Using ZIP: $ZIP_FILE"
          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

      - name: Locate Xcode project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(find "$GITHUB_WORKSPACE/source" -type d -name 'MobileHouseArrestSafe.xcodeproj' -print -quit)"
          if [ -z "$PROJECT" ]; then
            echo "ERROR: MobileHouseArrestSafe.xcodeproj not found."
            exit 1
          fi
          echo "Project: $PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Show Xcode information
        run: xcodebuild -version

      - name: Inspect project
        run: |
          xcodebuild             -project "${{ steps.project.outputs.project }}"             -list

      - name: Build MobileHouseArrestSafe
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild             -project "${{ steps.project.outputs.project }}"             -target "MobileHouseArrestSafe"             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

      - name: Locate generated APP
        id: app
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$GITHUB_WORKSPACE/source" -type d -path '*/build/Release-iphoneos/*.app' -print -quit)"
          if [ -z "$APP" ]; then
            APP="$(find "$GITHUB_WORKSPACE/source" -type d -name 'MobileHouseArrestSafe.app' -print -quit)"
          fi
          if [ -z "$APP" ]; then
            echo "ERROR: .app was not produced."
            find "$GITHUB_WORKSPACE/source" -type d -name '*.app' -print
            exit 1
          fi
          echo "APP: $APP"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Validate APP
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.app.outputs.app }}"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/MobileHouseArrestSafe"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "Bundle ID: $BUNDLE_ID"
          if [ "$BUNDLE_ID" != "com.nickdzvcl.mobilehousearrest" ]; then
            echo "ERROR: Wrong Bundle ID"
            exit 1
          fi

      - name: Prepare Payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/ipa"
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"
          cp -R "${{ steps.app.outputs.app }}" "$GITHUB_WORKSPACE/ipa/Payload/MobileHouseArrestSafe.app"
          test -d "$GITHUB_WORKSPACE/ipa/Payload/MobileHouseArrestSafe.app"
          test -f "$GITHUB_WORKSPACE/ipa/Payload/MobileHouseArrestSafe.app/Info.plist"
          find "$GITHUB_WORKSPACE/ipa/Payload" -maxdepth 2 -print

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/ipa"
          rm -f "$GITHUB_WORKSPACE/MobileHouseArrest-unsigned.ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/MobileHouseArrest-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/MobileHouseArrest-unsigned.ipa"

      - name: Validate IPA structure
        shell: bash
        run: |
          set -euo pipefail
          IPA="$GITHUB_WORKSPACE/MobileHouseArrest-unsigned.ipa"
          TEST_DIR="$RUNNER_TEMP/ipa-check"
          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"
          unzip -q "$IPA" -d "$TEST_DIR"
          test -d "$TEST_DIR/Payload"
          test -d "$TEST_DIR/Payload/MobileHouseArrestSafe.app"
          test -f "$TEST_DIR/Payload/MobileHouseArrestSafe.app/Info.plist"
          test -f "$TEST_DIR/Payload/MobileHouseArrestSafe.app/MobileHouseArrestSafe"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$TEST_DIR/Payload/MobileHouseArrestSafe.app/Info.plist")"
          if [ "$BUNDLE_ID" != "com.nickdzvcl.mobilehousearrest" ]; then
            echo "ERROR: IPA contains wrong Bundle ID: $BUNDLE_ID"
            exit 1
          fi
          echo "IPA VALIDATION PASSED"
          echo "Bundle ID: $BUNDLE_ID"
          find "$TEST_DIR" -maxdepth 3 -print

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: MobileHouseArrest-APP
          path: ${{ steps.app.outputs.app }}
          retention-days: 7

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MobileHouseArrest-IPA
          path: MobileHouseArrest-unsigned.ipa
          retention-days: 7
