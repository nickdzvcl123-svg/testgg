name: Build MobileHouseArrest

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build iOS app
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # TÌM VÀ GIẢI NÉN SOURCE ZIP
      # ==========================================
      - name: Extract source package
        shell: bash
        run: |
          set -e

          echo "=== Files in repository ==="
          find . -maxdepth 2 -type f -print

          echo ""
          echo "=== Searching ZIP ==="

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ Không tìm thấy file ZIP trong repository."
            exit 1
          fi

          echo "✅ ZIP found:"
          echo "$ZIP_FILE"

          rm -rf source
          mkdir -p source

          echo ""
          echo "=== Extracting ==="

          unzip -q "$ZIP_FILE" -d source

          echo ""
          echo "=== Extracted files ==="
          find source -maxdepth 5 -print

      # ==========================================
      # TÌM XCODE PROJECT
      # ==========================================
      - name: Locate project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT=$(find "$GITHUB_WORKSPACE/source" \
            -type d \
            -name "*.xcodeproj" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "❌ Không tìm thấy .xcodeproj"
            echo ""
            echo "Các file trong source:"
            find "$GITHUB_WORKSPACE/source" -maxdepth 6 -print
            exit 1
          fi

          echo "================================"
          echo "Xcode project:"
          echo "$PROJECT"
          echo "================================"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      # ==========================================
      # XCODE VERSION
      # ==========================================
      - name: Show Xcode information
        run: |
          xcodebuild -version

      # ==========================================
      # KIỂM TRA PROJECT
      # ==========================================
      - name: Inspect project
        run: |
          PROJECT="${{ steps.project.outputs.project }}"

          echo "=== Xcode project information ==="

          xcodebuild \
            -project "$PROJECT" \
            -list

      # ==========================================
      # BUILD APP
      # ==========================================
      - name: Build unsigned app
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          echo "================================"
          echo "Building MobileHouseArrestSafe"
          echo "================================"

          xcodebuild \
            -project "$PROJECT" \
            -target "MobileHouseArrestSafe" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # ==========================================
      # TÌM APP ĐÃ BUILD
      # ==========================================
      - name: Locate built app
        id: app
        shell: bash
        run: |
          set -e

          echo "=== Searching for APP ==="

          APP=$(find "$GITHUB_WORKSPACE/source" \
            -type d \
            -name "MobileHouseArrestSafe.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "❌ Không tìm thấy MobileHouseArrestSafe.app"

            echo ""
            echo "=== All .app files ==="

            find "$GITHUB_WORKSPACE/source" \
              -type d \
              -name "*.app" \
              -print

            exit 1
          fi

          echo "================================"
          echo "✅ APP FOUND"
          echo "$APP"
          echo "================================"

          echo "app=$APP" >> "$GITHUB_OUTPUT"

      # ==========================================
      # COPY APP
      # ==========================================
      - name: Prepare APP
        run: |
          set -e

          APP="${{ steps.app.outputs.app }}"

          rm -rf output
          mkdir -p output

          cp -R "$APP" \
            "output/MobileHouseArrestSafe.app"

          echo "=== APP ==="
          ls -lah output

      # ==========================================
      # TẠO IPA
      # ==========================================
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -e

          rm -rf Payload
          mkdir Payload

          cp -R \
            "output/MobileHouseArrestSafe.app" \
            "Payload/MobileHouseArrestSafe.app"

          cd Payload

          zip -r \
            "../MobileHouseArrest-unsigned.ipa" \
            "MobileHouseArrestSafe.app"

          cd ..

          echo ""
          echo "================================"
          echo "✅ IPA CREATED"
          echo "================================"

          ls -lh MobileHouseArrest-unsigned.ipa

      # ==========================================
      # UPLOAD APP
      # ==========================================
      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: MobileHouseArrest-APP
          path: output/MobileHouseArrestSafe.app
          retention-days: 7

      # ==========================================
      # UPLOAD IPA
      # ==========================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MobileHouseArrest-IPA
          path: MobileHouseArrest-unsigned.ipa
          retention-days: 7
